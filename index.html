<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="QuickNotes - A fast, modern note-taking web application with categories and search.">
    <title>QuickNotes - Note Taking App</title>
    <!-- Modern Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Stylesheet -->
    <link rel="stylesheet" href="style.css">
    <!-- JavaScript with defer -->
    <script src="script.js" defer></script>
</head>

<body>
    <!-- Header with App Name and Tagline -->
    <header class="app-header">
        <div class="header-inner">
            <h1 class="app-title">QuickNotes</h1>
            <p class="app-tagline">Capture your thoughts, organize by category, and stay productive</p>
        </div>
    </header>

    <!-- Main Content with Centred Column -->
    <main class="main-container">
        <!-- Section 1: Add a note -->
        <section class="card add-note-section" aria-labelledby="add-note-heading">
            <h2 id="add-note-heading" class="section-title">Add a note</h2>
            <form id="note-form" class="note-form" novalidate>
                <div class="form-group input-group">
                    <label for="note-input" class="form-label">Note</label>
                    <input type="text" id="note-input" name="note-input" class="form-control" placeholder="What's on your mind? (max 200 chars)" autocomplete="off">
                </div>

                <div class="form-group select-group">
                    <label for="note-category" class="form-label">Category</label>
                    <select id="note-category" name="note-category" class="form-control">
                        <option value="Personal">Personal</option>
                        <option value="Work">Work</option>
                        <option value="Study">Study</option>
                    </select>
                </div>

                <button type="submit" id="add-note-btn" class="btn btn-primary">Add Note</button>
            </form>

            <!-- Empty error paragraph below form -->
            <p id="error-message" class="error-message" role="alert" aria-live="polite"></p>
        </section>

        <!-- Section 2: Your notes -->
        <section class="card your-notes-section" aria-labelledby="your-notes-heading">
            <div class="section-header">
                <h2 id="your-notes-heading" class="section-title">Your notes</h2>
                <!-- Bonus: Clear all button -->
                <button type="button" id="clear-all-btn" class="btn btn-secondary clear-all-btn">Clear all</button>
            </div>

            <!-- Search box -->
            <div class="search-container">
                <label for="search-input" class="form-label sr-only">Search notes</label>
                <input type="search" id="search-input" class="form-control search-input" placeholder="Search notes by keyword..." autocomplete="off">
            </div>

            <!-- Count paragraph -->
            <p id="note-count" class="note-count">You have no notes yet.</p>

            <!-- Empty notes list -->
            <div id="notes-list" class="notes-list" aria-live="polite"></div>
        </section>
    </main>

    <!-- Semantic Footer -->
    <footer class="app-footer">
        <p>&copy; 2026 QuickNotes &bull; Web Foundations Project 1</p>
    </footer>
</body>

</html>
